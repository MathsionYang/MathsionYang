<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" fill="none">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12100c"/>
      <stop offset="0.6" stop-color="#0d0f14"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <radialGradient id="l-glow" cx="0.18" cy="0.5" r="0.62">
