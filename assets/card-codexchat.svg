<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" fill="none">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="0.6" stop-color="#0c0f15"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.18" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#3d8ee8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3d8ee8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-bar" x1="0" y1="0" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8ee8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#3d8ee8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" fill="url(#c-bg)"/>
  <rect width="1200" height="230" fill="url(#c-glow)"/>
  <rect x="0" y="0" width="3" height="230" fill="url(#c-bar)"/>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="10" stroke="#ffffff" stroke-opacity="0.06"/>

  <text x="60" y="60" fill="#5aa2f0" fill-opacity="0.8" font-size="11" font-weight="600" letter-spacing="3.4"
