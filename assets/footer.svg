<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" fill="none">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.5" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#d4b064" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#d4b064" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4b064" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4b064" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4b064" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" fill="url(#f-bg)"/>
  <rect width="1200" height="210" fill="url(#f-glow)"/>
  <rect x="0" y="0.5" width="1200" height="1" fill="url(#f-line)"/>

  <text x="600" y="82" fill="#e8e2d4" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0.8"
        font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">写完不算完，被用起来才算。</text>
  <text x="600" y="110" fill="#6d7688" font-size="13" text-anchor="middle" letter-spacing="0.4"
        font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">Shipping beats explaining — a project only counts once someone uses it.</text>

  <rect x="560" y="130" width="80" height="1" fill="#d4b064" fill-opacity="0.35"/>

  <text x="600" y="162" fill="#9aa3b4" font-size="13" text-anchor="middle" letter-spacing="0.6"
        font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">Star、Issue、一句“我用上了”，都是继续往下做的理由。</text>
  <text x="600" y="188" fill="#4f5868" font-size="11.5" text-anchor="middle" letter-spacing="2"
        font-family="'JetBrains Mono', Consolas, monospace">MATHSIONYANG · WUHAN</text>
</svg>
