      <rect x="847" y="158" width="30" height="24" rx="5"/>
      <rect x="923" y="158" width="30" height="24" rx="5"/>
      <rect x="961" y="158" width="30" height="24" rx="5"/>
      <rect x="999" y="158" width="30" height="24" rx="5"/>
      <rect x="1037" y="158" width="30" height="24" rx="5"/>
    </g>
    <rect x="885" y="158" width="30" height="24" rx="5" fill="#ff9f5a" fill-opacity="0.16" stroke="#ff9f5a" stroke-opacity="0.6"/>
    <circle cx="900" cy="170" r="3.4" fill="#ff9f5a"/>
  </g>
</svg>
