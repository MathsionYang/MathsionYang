name: Update Trophy SVG

on:
  schedule:
    - cron: "0 3 * * *"      # 每天 UTC 3:00 自动运行
  workflow_dispatch:          # 允许在 Actions 页面手动触发

permissions:
  contents: write             # 必须，否则无法把生成的 SVG 推回仓库

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          file: images/trophy.svg
          theme: flat
          column: 9
          max-rows: 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/trophy.svg
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update trophy SVG" && git push
          )
